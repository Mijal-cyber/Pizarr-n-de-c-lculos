<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor y Notitas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- CONVERSOR DE MONEDAS -->
        <section class="converter-section">

            <div class="input-card">
                <input
                    type="text"
                    id="noteName"
                    placeholder="Nombre de la notita"
                    autocomplete="off"
                >
            </div>

            <div class="money-input">

                <input
                    type="number"
                    id="amount"
                    min="0"
                    step="1"
                    value="20000"
                    aria-label="Cantidad en pesos"
                >

                <span>U$S</span>

            </div>

            <div class="conversion-result">

                <div id="result">13.00 U$S</div>

                <button id="convertBtn" type="button">
                    AGREGAR
                </button>

            </div>

        </section>


        <!-- NOTITAS -->
        <section class="notes-section">

            <div class="notes-grid" id="notesGrid">

                <article class="note note-white">
                    <h2>Vacaciones</h2>
                    <p>$20000 = 13 U$S</p>
                </article>

                <article class="note note-red"></article>

                <article class="note note-purple"></article>

                <article class="note note-yellow"></article>

            </div>


            <div class="add-note-bar">

                <input
                    id="noteText"
                    type="text"
                    placeholder="Comprar Galletas"
                    autocomplete="off"
                >

                <button id="addNoteBtn" type="button">
                    Agregar
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>

    <script src="script.js"></script>
</body>
</html>
